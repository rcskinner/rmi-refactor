name: Maven verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests, lint, and coverage gate
        run: mvn --batch-mode verify -Dsurefire.rerunFailingTestsCount=1

      - name: Check dependency usage
        run: mvn --batch-mode dependency:analyze -DfailOnWarning=true

      - name: Check TODO references
        shell: bash
        run: ./scripts/check-todo-references.sh

      - name: Check Java file sizes
        shell: bash
        run: ./scripts/check-file-size.sh

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: error
