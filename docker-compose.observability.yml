services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.8.2
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./config/observability/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./config/observability/loki.yml:/etc/loki/config.yml:ro
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.10.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki
    volumes:
      - ./config/observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/ledger:ro

  grafana:
    image: grafana/grafana:12.1.1
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
